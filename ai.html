<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursisten AI - Asisten Violet</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="ai-avatar">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2zM9 14v2M15 14v2"/>
                    </svg>
                </div>
                <h2>Selamat Datang di <span class="gradient-text">Nursisten</span></h2>
                <p class="subtitle">Asisten AI Violet siap membantu!</p>
            </div>
            
            <div class="modal-body">
                <div class="input-group">
                    <label for="userName">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Masukkan Nama Kamu
                    </label>
                    <input 
                        type="text" 
                        id="userName" 
                        placeholder="Contoh: Udin, Siti, Bambang..." 
                        autocomplete="off"
                    >
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn-primary" id="startChatBtn">
                    Mulai Chatting
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
            
            <p class="modal-note">✨ Dengan melanjutkan, kamu menyetujui persyaratan penggunaan Nursisten</p>
        </div>
    </div>

    <!-- Main Chat Container (Hidden by default) -->
    <div class="chat-container" id="chatContainer" style="display: none;">
        <div class="chat-header">
            <div class="header-left">
                <div class="ai-avatar-small">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2zM9 14v2M15 14v2"/>
                    </svg>
                </div>
                <div class="header-info">
                    <h3>Nursisten <span class="badge">AI Violet</span></h3>
                    <p class="status" id="statusText">Online - Menunggu pesan...</p>
                </div>
            </div>
            <div class="header-right">
                <div class="user-profile" id="userProfile">
                    <span class="user-name" id="displayName"></span>
                    <button class="icon-btn" id="editNameBtn" title="Ganti nama">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </button>
                </div>
                <button class="icon-btn" id="resetChat" title="Reset chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will appear here -->
        </div>
        
        <!-- Image Preview -->
        <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
            <div class="image-preview">
                <img src="" alt="Preview" id="imagePreview">
                <button class="close-preview" id="closePreview">×</button>
            </div>
        </div>
        
        <div class="chat-input-container">
            <input 
                type="file" 
                id="imageUpload" 
                accept="image/*" 
                style="display: none;"
            >
            <button class="action-btn" id="uploadImageBtn" title="Upload gambar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="2" y="2" width="20" height="20" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            
            <button class="action-btn" id="generateImageBtn" title="Generate gambar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M4 16l4-4 4 4 4-4 4 4"/>
                    <path d="M20 8v8"/>
                    <path d="M4 12v4"/>
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                </svg>
            </button>
            
            <textarea 
                id="userInput" 
                class="chat-input" 
                placeholder="Ketik pesan atau prompt gambar..."
                rows="1"
            ></textarea>
            
            <button class="send-button" id="sendButton">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
                </svg>
            </button>
        </div>
        
        <div class="footer-note">
            <span>✨ Nursisten AI - Violet Edition</span>
            <span class="model-info" id="modelInfo"></span>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
